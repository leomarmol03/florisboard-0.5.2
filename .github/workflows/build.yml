name: Build (auto)

# Automatically compiles the keyboard on every branch push (and on demand), so
# that any change is verified against a real Android build without having to
# merge into `main` first. The resulting release APK is uploaded as an artifact.

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
      - "fastlane/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v4.0.2

      - name: Set up Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        id: gradle_build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --stacktrace --console=plain assembleRelease 2>&1 | tee gradle-build.log

      # On failure, publish the compiler output as a check run so the errors can be
      # inspected without access to the raw job logs.
      - name: Publish build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          {
            echo "### Gradle build errors"
            echo '```'
            grep -aE "^e: |error:|FAILURE:|What went wrong|> Task .* FAILED|Caused by|Could not|\.kt:[0-9]+:[0-9]+" gradle-build.log | head -n 200 || true
            echo '```'
            echo ""
            echo "### Last 150 lines of the build log"
            echo '```'
            tail -n 150 gradle-build.log
            echo '```'
          } > gradle-errors.md
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name="gradle-errors" \
            -f head_sha="${GITHUB_SHA}" \
            -f status=completed \
            -f conclusion=failure \
            -f "output[title]=Gradle build errors" \
            -f "output[summary]=Compiler and build errors, see output text." \
            -F "output[text]=@gradle-errors.md" > /dev/null || true
          # Also surface the first errors as workflow annotations.
          grep -aE "^e: |\.kt:[0-9]+:[0-9]+" gradle-build.log | head -n 10 | while IFS= read -r line; do
            echo "::error::${line}"
          done || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      # Unit tests are currently not part of the release gate upstream, so this
      # step only makes sure the test sources keep compiling.
      - name: Compile unit tests
        continue-on-error: true
        run: ./gradlew --console=plain compileReleaseUnitTestKotlin

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
